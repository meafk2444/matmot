<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matmot</title>
<style>
  :root{
    --bg1:#2b1055;
    --bg2:#7597de;
    --pink:#ff6fb5;
    --yellow:#ffd23f;
    --cyan:#3ee6c4;
    --white:#fdfaf3;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  #title{
    position:absolute;
    top:4vh;
    left:50%;
    transform: translateX(-50%);
    text-align:center;
    color:var(--white);
    text-shadow: 0 0 12px var(--pink), 0 0 24px rgba(255,111,181,0.5);
    z-index:5;
    pointer-events:none;
  }
  #title h1{
    margin:0;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    letter-spacing: 1px;
  }
  #title p{
    margin:6px 0 0;
    font-size: clamp(0.8rem, 2vw, 1rem);
    opacity:0.85;
  }

  .light{
    position:absolute;
    width:40vmax;
    height:40vmax;
    border-radius:50%;
    filter: blur(60px);
    opacity:0.35;
    animation: drift 9s ease-in-out infinite alternate;
    z-index:0;
  }
  .light.l1{ background:var(--pink); top:-10%; left:-10%; }
  .light.l2{ background:var(--cyan); bottom:-15%; right:-10%; animation-delay:2s; }
  .light.l3{ background:var(--yellow); top:20%; right:20%; animation-delay:4s; }

  @keyframes drift{
    from{ transform: translate(0,0) scale(1); }
    to{ transform: translate(6vw,-4vh) scale(1.15); }
  }

  #giraffe-wrap{
    position:relative;
    width: min(46vw, 340px);
    margin-bottom: 6vh;
    cursor:pointer;
    z-index:2;
    transform-origin: 50% 100%;
    animation: dance 1.1s ease-in-out infinite;
  }

  #giraffe-wrap img{
    width:100%;
    display:block;
    filter: drop-shadow(0 18px 14px rgba(0,0,0,0.35));
    transform-origin: 50% 100%;
    user-select:none;
    -webkit-user-drag:none;
  }

  #shadow{
    position:absolute;
    bottom:-1.5vh;
    left:50%;
    width:70%;
    height:16px;
    background: rgba(0,0,0,0.45);
    border-radius:50%;
    transform: translateX(-50%) scaleX(1);
    filter: blur(4px);
    z-index:1;
    animation: shadowPulse 1.1s ease-in-out infinite;
  }

  @keyframes dance{
    0%   { transform: translateY(0) rotate(-6deg); }
    25%  { transform: translateY(-2.5vh) rotate(0deg); }
    50%  { transform: translateY(0) rotate(6deg); }
    75%  { transform: translateY(-2.5vh) rotate(0deg); }
    100% { transform: translateY(0) rotate(-6deg); }
  }
  @keyframes shadowPulse{
    0%,100%{ transform: translateX(-50%) scaleX(0.85); opacity:0.5; }
    25%,75%{ transform: translateX(-50%) scaleX(0.65); opacity:0.3; }
    50%{ transform: translateX(-50%) scaleX(0.85); opacity:0.5; }
  }

  #hint{
    position:absolute;
    bottom:3vh;
    left:50%;
    transform: translateX(-50%);
    color: var(--white);
    opacity:0.7;
    font-size:0.85rem;
    z-index:5;
    pointer-events:none;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }

  #bubble{
    position:absolute;
    top:-3.4rem;
    left:50%;
    transform: translateX(-50%) scale(0);
    background: var(--white);
    color:#2b1055;
    font-weight:bold;
    padding:8px 14px;
    border-radius:16px;
    white-space:nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index:10;
    transition: transform 0.18s cubic-bezier(.5,1.8,.5,1);
  }
  #bubble.show{ transform: translateX(-50%) scale(1); }
  #bubble::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    transform: translateX(-50%);
    border-width:8px 8px 0 8px;
    border-style:solid;
    border-color: var(--white) transparent transparent transparent;
  }

  .confetti{
    position:fixed;
    top:-20px;
    width:10px;
    height:10px;
    z-index:20;
    pointer-events:none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(720deg); opacity:0.9; }
  }

  .fly-emoji{
    position:fixed;
    z-index:25;
    pointer-events:none;
    font-size: 2rem;
    animation: flyUp 1.6s ease-out forwards;
  }
  @keyframes flyUp{
    0%{ transform: translateY(0) scale(0.6) rotate(0deg); opacity:1; }
    100%{ transform: translateY(-40vh) scale(1.4) rotate(45deg); opacity:0; }
  }

  #flash{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:30;
    pointer-events:none;
  }

  #counter{
    position:absolute;
    top:4vh;
    right:3vw;
    color:var(--white);
    background: rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    padding:6px 12px;
    border-radius:20px;
    font-size:0.85rem;
    z-index:5;
  }

  #footer-credit{
    position:absolute;
    bottom:1.2vh;
    left:50%;
    transform: translateX(-50%);
    color: var(--white);
    opacity:0.45;
    font-size:0.7rem;
    z-index:5;
    pointer-events:none;
  }

  @keyframes spinCrazy{ to{ transform: rotate(360deg) scale(1.3); } }
  @keyframes shakeCrazy{
    0%,100%{ transform: translateX(0) rotate(0); }
    20%{ transform: translateX(-14px) rotate(-8deg); }
    40%{ transform: translateX(14px) rotate(8deg); }
    60%{ transform: translateX(-10px) rotate(-6deg); }
    80%{ transform: translateX(10px) rotate(6deg); }
  }
  @keyframes growShrink{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.6); }
  }
  @keyframes rainbow{
    0%{ filter: hue-rotate(0deg) saturate(1) drop-shadow(0 18px 14px rgba(0,0,0,0.35)); }
    100%{ filter: hue-rotate(360deg) saturate(2.2) drop-shadow(0 18px 14px rgba(0,0,0,0.35)); }
  }
  @keyframes flipIt{
    0%{ transform: rotateY(0deg); }
    100%{ transform: rotateY(360deg); }
  }
  @keyframes moonwalk{
    0%{ transform: translateX(0) scaleX(-1); }
    50%{ transform: translateX(-25vw) scaleX(-1); }
    100%{ transform: translateX(0) scaleX(-1); }
  }

</style>
</head>

  <div id="hint">👉 clique sur Matmot !</div>
  <div id="footer-credit">Personnage original by Matmot 🎨</div>
</div>

<div id="flash"></div>

<script>
const giraffeWrap = document.getElementById('giraffe-wrap');
const giraffeImg = document.getElementById('giraffe');
const bubble = document.getElementById('bubble');
const flash = document.getElementById('flash');
const hint = document.getElementById('hint');
const counterEl = document.getElementById('clickCount');

let clickCount = 0;

const phrases = [
  "Wouhou ! 🎉",
  "Encore, encore !",
  "Regarde-moi danser !",
  "Je suis une star 🌟",
  "T'as vu ce move ?",
  "Disco fever !",
  "Giga groove 🕺",
  "On lâche rien !",
  "Tagadaaa !",
  "Je décolle ! 🚀",
  "Trop cool ce clic !",
  "Je pense que c'est drôle 😄"
];

const emojiSets = [
  ["🎉","✨","🎊"],
  ["🍌","🍌","🍌"],
  ["🌟","💫","⭐"],
  ["🦄","🌈"],
  ["🔥","🔥"],
  ["🍾","🥳"],
  ["💛","🟡"]
];

const confettiColors = ["#ff6fb5","#ffd23f","#3ee6c4","#7597de","#fdfaf3","#ff8a3d"];

function showBubble(text){
  bubble.textContent = text;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
  clearTimeout(bubble._t);
  bubble._t = setTimeout(()=> bubble.classList.remove('show'), 1400);
}

function launchConfetti(count=40){
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random()*8;
    c.style.width = size+'px';
    c.style.height = (size*0.4)+'px';
    c.style.left = Math.random()*100+'vw';
    c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    c.style.animationDuration = (2 + Math.random()*1.8)+'s';
    c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 4200);
  }
}

function launchEmojis(){
  const set = emojiSets[Math.floor(Math.random()*emojiSets.length)];
  const rect = giraffeWrap.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const e = document.createElement('div');
    e.className = 'fly-emoji';
    e.textContent = set[Math.floor(Math.random()*set.length)];
    e.style.left = (rect.left + rect.width/2 + (Math.random()*160-80)) + 'px';
    e.style.top = (rect.top + rect.height*0.4) + 'px';
    e.style.animationDelay = (Math.random()*0.3)+'s';
    document.body.appendChild(e);
    setTimeout(()=> e.remove(), 2000);
  }
}

function flashScreen(){
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(()=>{
    flash.style.transition = 'opacity 0.4s ease-out';
    flash.style.opacity = '0';
  });
}

function pauseDanceLoop(){
  giraffeWrap.style.animation = 'none';
}
function resumeDanceLoop(){
  giraffeWrap.style.animation = 'dance 1.1s ease-in-out infinite';
}

const actions = [

  function spin(){
    pauseDanceLoop();
    giraffeWrap.style.transformOrigin = '50% 60%';
    giraffeWrap.style.animation = 'spinCrazy 0.6s ease-in-out';
    launchConfetti(30);
    showBubble("Wiiii ! 🌀");
    setTimeout(resumeDanceLoop, 650);
  },

  function shake(){
    pauseDanceLoop();
    giraffeWrap.style.animation = 'shakeCrazy 0.5s ease-in-out';
    showBubble("Séisme de danse ! 🕺");
    setTimeout(resumeDanceLoop, 550);
  },

  function grow(){
    pauseDanceLoop();
    giraffeWrap.style.animation = 'growShrink 0.7s ease-in-out';
    showBubble("Je grandis !! 🌱");
    setTimeout(resumeDanceLoop, 750);
  },

  function rainbow(){
    pauseDanceLoop();
    giraffeImg.style.animation = 'rainbow 1s linear';
    showBubble("Mode arc-en-ciel 🌈");
    setTimeout(()=>{ giraffeImg.style.animation=''; resumeDanceLoop(); }, 1050);
  },

  function flip(){
    pauseDanceLoop();
    giraffeWrap.style.animation = 'flipIt 0.8s ease-in-out';
    showBubble("Flip parfait ! 🤸");
    setTimeout(resumeDanceLoop, 850);
  },

  function moonwalk(){
    pauseDanceLoop();
    giraffeWrap.style.animation = 'moonwalk 1.2s ease-in-out';
    showBubble("Moonwalk 🌙✨");
    setTimeout(resumeDanceLoop, 1250);
  },

  function confettiParty(){
    launchConfetti(70);
    showBubble("PARTY TIME 🎊");
  },

  function emojiRain(){
    launchEmojis();
    showBubble(phrases[Math.floor(Math.random()*phrases.length)]);
  },

  function bigFlash(){
    flashScreen();
    launchConfetti(20);
    showBubble("Flash disco ! 📸");
  },

  function tinyBubbleOnly(){
    showBubble(phrases[Math.floor(Math.random()*phrases.length)]);
  }
];

let lastActionIndex = -1;

giraffeWrap.addEventListener('click', ()=>{
  clickCount++;
  counterEl.textContent = clickCount;
  hint.style.display = 'none';

  let idx;
  do{
    idx = Math.floor(Math.random()*actions.length);
  } while(idx === lastActionIndex && actions.length > 1);
  lastActionIndex = idx;

  actions[idx]();

  if(clickCount % 10 === 0){
    setTimeout(()=>{
      launchConfetti(120);
      showBubble("🎆 " + clickCount + " clics, méga bonus !");
    }, 300);
  }
});

</script>
